<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Nino Chavez — product architect and builder</title>
  <desc id="d">Open Practice. I build the system, run the operation, and keep the evidence. Chicago, building since 1999.</desc>

  <!-- Palette and shape harvested from ninochavez.co and its share card, not chosen:
       #09101E ground · #DBD4CC cream · #F1834C accent · #2738BE circle · #14679E action.
       Square corners throughout — the live site's buttons compute to border-radius 0. -->

  <defs>
    <clipPath id="f"><rect width="1200" height="420"/></clipPath>
    <clipPath id="circle"><circle cx="1012" cy="196" r="132"/></clipPath>
  </defs>

  <g clip-path="url(#f)">
    <rect width="1200" height="420" fill="#09101E"/>

    <!-- The share card sets the wordmark against a hard blue disc. Kept as an
         abstract mark here: a portrait would have to be embedded as a data URI,
         and a README hero should stay a few kilobytes. -->
    <circle cx="1000" cy="196" r="128" fill="#2738BE"/>
    <g transform="translate(1000,196) scale(0.86,1)"
       font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
       font-size="104" fill="#DBD4CC" text-anchor="middle">
      <text y="36" letter-spacing="-2">NC</text>
    </g>

    <text x="72" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" letter-spacing="5.4" font-weight="700" fill="#F1834C">OPEN PRACTICE</text>

    <!-- Horizontal scale approximates the site's condensed display face, which
         has no system equivalent. Letterforms stay upright and legible. -->
    <g transform="translate(66,0) scale(0.86,1)"
       font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
       font-size="118" fill="#DBD4CC" letter-spacing="1">
      <text x="0" y="200">NINO</text>
      <text x="0" y="300">CHAVEZ</text>
    </g>

    <path d="M72 340 H 560" stroke="#F1834C" stroke-width="2"/>

    <text x="72" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="21" font-weight="600" fill="#DBD4CC" letter-spacing="0.4">I build the system, run the operation, and keep the evidence.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#7d8797">
      <text x="1128" y="378" text-anchor="end">CHICAGO · BUILDING SINCE 1999</text>
    </g>
  </g>
</svg>
